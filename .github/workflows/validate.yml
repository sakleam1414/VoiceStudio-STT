name: Validate
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile stt_server.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check microphone.plugin.js
      - run: node --check subtitles.plugin.js
      - run: node --check stt_updates.js
  updater:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/test-updater.ps1
        shell: powershell
